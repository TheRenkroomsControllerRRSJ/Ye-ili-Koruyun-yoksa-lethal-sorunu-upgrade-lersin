<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programcının kütüphanesi</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header class="header">
        <img src="../static/img/logo.png" alt="logo" width="30" height="30">
        <ul class="main-list">
            <li class="list__item">
              <a href="">
                <img src="../static/img/login.svg" alt="login" width="20" height="20">
              </a>
        </ul>
      </header>
      <main>
        {% block content %}
        <form action="{{ url_for('form_create') }}" method="post" class="creat-form">
            <div class="form__card">
                <img class="card__img" src="../static/img/post_icon.png" width="250" height="250" alt="post_icon">
                <div class="form__inputs">
                    <label for="title">
                        <input class="form__input" type="text" name="title" id="title" placeholder="Kayıt başlığını yazın" required>
                    </label>
                    <button type="button" class = "mic-button" data-target="title">Sesle Yaz</button>
                    <label for="subtitle">
                        <input class="form__input" type="text" name="subtitle" id="subtitle" placeholder="Alt başlığını yazın" required>
                    </label>
                    <button type="button" class = "mic-button" data-target="subtitle">Sesle Yaz</button>
                </div>
                <label for="text">
                    <textarea class="form__text" name="text" id="text" cols="30" rows="10" required placeholder="Biraz metin yazın..."></textarea>
                </label>
                <button class="form__button">Oluştur</button>
                <button type="button" class = "mic-button" data-target="text">Sesle Yaz</button>
            </div>
        </form>
        {% endblock %}
      </main>
<script>
  const micButtons = document.querySelectorAll('.mic-button');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'tr-TR';
    recognition.continuous = false;
    recognition.interimResults = false;

    let activeInput = null;

    micButtons.forEach(button => {
      button.addEventListener('click', () => {
        const targetId = button.getAttribute('data-target');
        activeInput = document.getElementById(targetId);

        recognition.start();
        button.textContent = '🎙️ Dinleniyor...';
      });
    });

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      if (activeInput) {
        activeInput.value += transcript + ' ';
      }

      micButtons.forEach(btn => btn.textContent = '🎤');
    };

    recognition.onerror = (event) => {
      console.error('Hata:', event.error);
      micButtons.forEach(btn => btn.textContent = '🎤');
    };

    recognition.onend = () => {
      micButtons.forEach(btn => btn.textContent = '🎤');
    };
  } else {
    micButtons.forEach(btn => {
      btn.disabled = true;
      btn.textContent = 'Tarayıcı desteklemiyor';
    });
  }
</script>
</body>
</html>
